[project]
name = "rq-rediscron"
description = "Redis-backed runtime-editable cron scheduler for RQ"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = []
dependencies = [
    "redis>=5",
    "rq>=2.8",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gams/rq-rediscron"
Repository = "https://github.com/gams/rq-rediscron"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rediscron"]

[tool.hatch.build.targets.sdist]
exclude = ["docs*", "tests*", "foo_*"]

[tool.hatch.version]
path = "rediscron/__meta__.py"

[dependency-groups]
dev = [
    "shibuya>=2026.5.19",
    "tox>=4.55.0",
    "tox-uv>=1.35.2",
]
